<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">Architecture overview</title>
  <desc id="desc">HubSpot contacts move into Salesforce through Revenue Handoff Integration, a custom HubSpot to Salesforce API integration that runs on demand for approved records through a dedicated integration identity. A separate modeled handoff population of synthetic contacts is also loaded into Salesforce. Salesforce evaluates every HubSpot-originated contact: Synced contacts can receive a sales follow-up, Needs Review contacts are remediated by a data steward and re-evaluated automatically, and operational reports show the queue. Power BI reads the modeled population only, read-only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #334155; }
    .note { font-size: 12px; fill: #475569; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .real { fill: #eef4fb; stroke: #1f4e79; stroke-width: 2; }
    .sim { fill: #fff8ec; stroke: #b26b00; stroke-width: 2; stroke-dasharray: 7 5; }
    .sub { fill: #ffffff; stroke: #1f4e79; stroke-width: 1.5; }
    .ok { fill: #ecfdf3; stroke: #15803d; stroke-width: 1.8; }
    .warn { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; }
    .edge { stroke: #334155; stroke-width: 1.8; fill: none; }
    .ro { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
  </style>

  <rect x="0" y="0" width="1240" height="680" fill="#ffffff"/>
  <text x="40" y="44" class="h" style="font-size:20px">Salesforce–HubSpot data governance: architecture overview</text>
  <text x="40" y="68" class="note">Conceptual view. Synthetic data; fictional company.</text>

  <!-- HubSpot -->
  <rect x="40" y="110" width="200" height="150" rx="10" class="real"/>
  <text x="58" y="142" class="h">HubSpot</text>
  <text x="58" y="164" class="s">Marketing system</text>
  <text x="58" y="186" class="s">Identity · lifecycle stage</text>
  <text x="58" y="204" class="s">· original traffic source</text>
  <text x="58" y="242" class="note">Read-only to the integration</text>

  <path d="M240,185 L288,185" class="edge" marker-end="url(#arrow)"/>

  <!-- Revenue Handoff Integration -->
  <rect x="290" y="100" width="250" height="170" rx="10" class="real"/>
  <rect x="306" y="114" width="52" height="20" rx="4" fill="#1f4e79"/>
  <text x="316" y="128" class="tag" style="fill:#ffffff">REAL</text>
  <text x="306" y="160" class="h">Revenue Handoff Integration</text>
  <text x="306" y="182" class="s">Custom HubSpot → Salesforce</text>
  <text x="306" y="200" class="s">API integration</text>
  <text x="306" y="224" class="s">On demand · approved records only</text>
  <text x="306" y="242" class="s">Dedicated integration identity</text>
  <text x="306" y="260" class="s">Upsert by HubSpot identity</text>

  <text x="550" y="155" class="note">Live API</text>

  <!-- Modeled handoff population -->
  <rect x="40" y="330" width="500" height="130" rx="10" class="sim"/>
  <rect x="56" y="344" width="78" height="20" rx="4" fill="#b26b00"/>
  <text x="64" y="358" class="tag" style="fill:#ffffff">MODELED</text>
  <text x="56" y="390" class="h">Modeled handoff population</text>
  <text x="56" y="412" class="s">24 synthetic submissions loaded into Salesforce by HubSpot identity</text>
  <text x="56" y="430" class="s">21 received · 2 blocked as likely duplicates · 1 not sent (out of scope)</text>
  <text x="56" y="448" class="note">Feeds the analytics demonstration</text>


  <!-- Salesforce container -->
  <rect x="600" y="100" width="410" height="480" rx="12" class="real"/>
  <rect x="616" y="112" width="52" height="20" rx="4" fill="#1f4e79"/>
  <text x="626" y="126" class="tag" style="fill:#ffffff">REAL</text>
  <text x="680" y="128" class="h">Salesforce: system of record</text>

  <rect x="620" y="145" width="370" height="54" rx="8" class="sub"/>
  <text x="638" y="168" class="h">HubSpot-originated Contact</text>
  <text x="638" y="188" class="s">Arrives with marketing data only</text>

  <path d="M805,199 L805,221" class="edge" marker-end="url(#arrow)"/>

  <rect x="620" y="223" width="370" height="54" rx="8" class="sub"/>
  <text x="638" y="246" class="h">Governance evaluation</text>
  <text x="638" y="266" class="s">Email · linked account · lifecycle stage</text>

  <path d="M707,277 L707,299" class="edge" marker-end="url(#arrow)"/>
  <path d="M902,277 L902,299" class="edge" marker-end="url(#arrow)"/>

  <rect x="620" y="301" width="175" height="54" rx="8" class="ok"/>
  <text x="636" y="324" class="h">Synced</text>
  <text x="636" y="344" class="s">Ready for Sales</text>

  <rect x="815" y="301" width="175" height="54" rx="8" class="warn"/>
  <text x="831" y="324" class="h">Needs Review</text>
  <text x="831" y="344" class="s">Readable reason</text>

  <path d="M707,355 L707,377" class="edge" marker-end="url(#arrow)"/>
  <path d="M902,355 L902,377" class="edge" marker-end="url(#arrow)"/>

  <rect x="620" y="379" width="175" height="62" rx="8" class="sub"/>
  <text x="636" y="402" class="h">Sales follow-up</text>
  <text x="636" y="422" class="s">Sales-ready contacts only</text>

  <rect x="815" y="379" width="175" height="62" rx="8" class="sub"/>
  <text x="831" y="402" class="h">Steward remediation</text>
  <text x="831" y="422" class="s">Data fixed in Salesforce</text>

  <!-- Re-evaluation loop -->
  <path d="M990,410 L1000,410 L1000,250 L992,250" class="edge" marker-end="url(#arrow)"/>
  <text x="831" y="464" class="note">Re-evaluated automatically</text>

  <rect x="620" y="490" width="370" height="62" rx="8" class="sub"/>
  <text x="638" y="514" class="h">Operational reports</text>
  <text x="638" y="534" class="s">Remediation queue · HubSpot-originated inventory</text>

  <!-- Salesforce to Power BI (read-only) -->
  <path d="M1010,520 L1046,520" class="ro" marker-end="url(#arrow-grey)"/>

  <!-- Power BI -->
  <rect x="1048" y="420" width="172" height="160" rx="10" class="real"/>
  <rect x="1064" y="434" width="52" height="20" rx="4" fill="#1f4e79"/>
  <text x="1074" y="448" class="tag" style="fill:#ffffff">REAL</text>
  <text x="1064" y="478" class="h">Power BI</text>
  <text x="1064" y="500" class="s">Integration-health</text>
  <text x="1064" y="518" class="s">console</text>
  <text x="1064" y="542" class="note">Modeled population only</text>
  <text x="1064" y="560" class="note">Read-only</text>

  <!-- Inputs into Salesforce (drawn last so they sit above the container) -->
  <path d="M540,165 L618,165" class="edge" marker-end="url(#arrow)"/>
  <path d="M540,395 L570,395 L570,188 L618,188" class="edge" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="620" width="26" height="16" rx="3" class="real"/>
  <text x="74" y="633" class="note">Real: implemented and verified</text>
  <rect x="300" y="620" width="26" height="16" rx="3" class="sim"/>
  <text x="334" y="633" class="note">Modeled: synthetic population</text>
  <path d="M560,628 L600,628" class="ro" marker-end="url(#arrow-grey)"/>
  <text x="610" y="633" class="note">Read-only relationship</text>
</svg>
